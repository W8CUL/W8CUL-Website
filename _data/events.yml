# WVU Amateur Radio Club Events
# Edit this file to update events across the site

# Recurring events
recurring:
  - id: weekly-meeting
    name: Weekly Club Meeting
    day: Thursday
    time: "7:00 PM"
    location: "AERB 135"
    description: "Join us for our weekly meeting! All experience levels welcome."
    type: meeting

  - id: net-night
    name: W8CUL Net
    day: Thursday
    time: "9:00 PM"
    location: "145.450 MHz Repeater"
    description: "Weekly on-air net. Check in and practice your radio skills!"
    type: net

# Upcoming special events (add real events with confirmed dates)
# Tech in A Day (TIAD): two per semester in AERB 135 — contact club for dates
upcoming:
  - id: tiad
    name: Tech in A Day (TIAD)
    date: ""
    time: "Contact club for schedule"
    location: "AERB 135"
    description: "Two Tech-in-A-Day events each semester. Study and test for your Technician license in one day. Contact the club for this semester's dates."
    type: exam

  - id: field-day
    name: ARRL Field Day
    date: ""
    end_date: ""
    time: "TBD"
    location: "TBD"
    description: "ARRL Field Day - the largest amateur radio event of the year. Check with the club for this year's date and location."
    type: special
    link: "https://www.arrl.org/field-day"

  - id: ve-exam
    name: VE License Exam Session
    date: ""
    time: "Contact club for schedule"
    location: "AERB 135"
    description: "Walk-ins welcome when scheduled. Bring exam fee (confirm current amount), two forms of ID, and your FRN. Contact the club for upcoming exam dates."
    type: exam

