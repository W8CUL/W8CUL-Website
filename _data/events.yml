# WVU Amateur Radio Club Events
# Edit this file to update events across the site

# Recurring events
recurring:
  - id: weekly-meeting
    name: Weekly Club Meeting
    day: Tuesday
    time: "7:00 PM"
    location: "ESB 529 (The Shack)"
    description: "Join us for our weekly meeting! All experience levels welcome."
    type: meeting

  - id: study-session
    name: License Study Session
    day: Thursday
    time: "6:00 PM"
    location: "ESB 529 (The Shack)"
    description: "Study for your Technician, General, or Extra class license exam."
    type: study

  - id: net-night
    name: W8CUL Net
    day: Wednesday
    time: "8:00 PM"
    location: "145.450 MHz Repeater"
    description: "Weekly on-air net. Check in and practice your radio skills!"
    type: net

