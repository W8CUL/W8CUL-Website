  # Silver Sponsors
  - id: dxengineering
    name: DX Engineering
    tier: silver
    logo: /assets/sponsors/dxengineering.png
    url: https://www.dxengineering.com/
    description: Discount partner for club equipment purchases

  - id: gigaparts
    name: GigaParts
    tier: silver
    logo: /assets/sponsors/gigaparts.png
    url: https://www.gigaparts.com/
    description: Amateur radio equipment supplier

