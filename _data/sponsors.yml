  - id: wvu-engineering
    name: WVU Statler College of Engineering
    tier: platinum
    logo: /assets/sponsors/wvu-statler.png
    url: https://statler.wvu.edu/
    description: Primary institutional support for the club

  # Gold Sponsors
  - id: arrl-foundation
    name: ARRL Foundation
    tier: gold
    logo: /assets/sponsors/arrl.png
    url: https://www.arrl.org/the-arrl-foundation
