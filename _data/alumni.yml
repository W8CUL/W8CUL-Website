# Featured alumni spotlight
spotlight:
  name: Dr. James Thompson
  callsign: K8JT
  graduation_year: 1998
  degree: PhD Electrical Engineering
  current_position: RF Systems Engineer at NASA Goddard
  bio: >
    James was W8CUL president from 1996-1998 and helped establish the club's first
    satellite ground station. His work at NASA includes designing communication
    systems for deep space missions. He credits W8CUL with sparking his passion
    for space communications.
  quote: "The skills and friendships I developed at W8CUL launched my career in aerospace communications."

