# WVU Amateur Radio Club Sponsors
# Edit this file to update sponsor information

tiers:
  - id: platinum
    name: Platinum Sponsors
    description: Major supporters of the WVU Amateur Radio Club
    min_amount: 1000

  - id: gold
    name: Gold Sponsors
    description: Significant contributors to our programs
    min_amount: 500

  - id: silver
    name: Silver Sponsors
    description: Valued supporters of our activities
    min_amount: 100

  - id: equipment
    name: Equipment Donors
    description: Organizations and individuals who have donated equipment

sponsors:
