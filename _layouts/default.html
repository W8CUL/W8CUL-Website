<!-- Scripts -->
<script src="{{ site.baseurl }}/javascripts/1756389273/vendor/bootstrap/bootstrap.bundle.min.js"></script>

<script>
/* global fetch */
const wvuEmergencyAlert = (() => {
    'use strict';

    const getEmergencyEl = document.querySelector('#js-emergency-alert');
    const getEmergencyEvents = getEmergencyEl.querySelector('#js-emergency-alert__events');
    const getEmergencyDomain = getEmergencyEl.querySelector('#js-emergency-alert-domain');
    const disableAlert = getEmergencyEl.dataset.disableEmergencyAlert || 'false';
    const emergencyAlertUrl = getEmergencyEl.dataset.emergencyAlertJsonFeed || 'https://emergency.wvu.edu/emergency.json';
    if (!emergencyAlertUrl) return;

    const populateEmergencyEvents = (items) => {
        getEmergencyEvents.innerHTML = '';
        items.forEach((item) => {
            const p = document.createElement('p');
            p.className = 'mb-0';
            const strong = document.createElement('strong');
            strong.textContent = item.title;
            p.appendChild(strong);
            const text = document.createTextNode(` ${item.body}`);
            p.appendChild(text);
            getEmergencyEvents.appendChild(p);
        });
    };

    const showEmergencyAlert = () => {
        getEmergencyEl.classList.remove('d-none');
    };

    const fetchEmergencyAlert = async () => {
        if (disableAlert === 'true') return;
        try {
            const response = await fetch(emergencyAlertUrl);
            if (!response.ok) throw new Error('Network response was not ok');
            const data = await response.json();
            if (data.events && data.events.length > 0) {
                populateEmergencyEvents(data.events);
                showEmergencyAlert();
            }
        } catch (error) {
            console.error('Error fetching emergency alert:', error);
        }
    };

    fetchEmergencyAlert();
})();
</script>

<script>
/* Last commit date */
fetch('https://api.github.com/repos/W8CUL/W8CUL-Website/commits?per_page=1')
    .then(response => response.json())
    .then(data => {
        if (data[0] && data[0].commit && data[0].commit.author.date) {
            const date = new Date(data[0].commit.author.date);
            document.getElementById('git-last-commit-date').textContent = date.toLocaleDateString();
        }
    })
    .catch(error => console.log('Could not fetch last commit date'));
</script>

</body>
</html>
